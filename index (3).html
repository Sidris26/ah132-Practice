.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.opt:hover{border-color:var(--c)}

.opt.sel{border-color:var(--c);background:#f5f9ff}.opt.sel b{background:var(--c);color:#fff}
.opt.ok{border-color:var(--ok);background:#e7f0ff}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:#fff1e6}.opt.no b{background:var(--bad);color:#fff}
.note{border-radius:14px;padding:12px 14px;margin:14px 0;background:#fff;border-left:8px solid var(--ok)}

.big{font-size:3.4rem;font-weight:800;margin:6px 0;color:var(--c1)}
.why{margin-top:8px!important;padding-top:8px;border-top:1px solid #dbe6fb}.foot{color:var(--mute);font-size:.85rem;margin-top:28px}
button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}

, "a": ["A", "B", "C", "D", "E"], "m": true, "e": "A, B, C, D, E (all)"}, {"n": 35, "t": 2, "q": "Metacognition means:", "o": [["A", "Memorizing facts"], ["B", "Thinking about your own thinking"], ["C", "Reading quickly"], ["D", "Studying only with others"]], "a": ["B"], "m": false, "e": "B. Thinking about your own thinking"}, {"n": 36, "t": 2, "q": "Learn mode means:", "o": [["A", "Study as if you have to teach it"], ["B", "Read without testing yourself"], ["C", "Memorize answers only"], ["D", "Study only before an exam"]], "a": ["A"], "m": false, "e": "A. Study as if you have to teach it"}, {"n": 37, "t": 2, "q": "Which Bloom's level comes after Understanding?", "o": [["A", "Remembering"], ["B", "Applying"], ["C", "Creating"], ["D", "Evaluating"]], "a": ["B"], "m": false, "e": "B. Applying"}, {"n": 38, "t": 2, "q": "Highest Bloom's level listed?", "o": [["A", "Remembering"], ["B", "Understanding"], ["C", "Evaluating"], ["D", "Creating"]], "a": ["D"], "m": false, "e": "D. Creating"}, {"n": 39, "t": 2, "q": "First step of the Short Study Cycle?", "o": [["A", "Reward"], ["B", "Review"], ["C", "Set a goal"], ["D", "Assess"]], "a": ["C"], "m": false, "e": "C. Set a goal"}, {"n": 40, "t": 2, "q": "Focused study in the Short Study Cycle is about:", "o": [["A", "5-10 min"], ["B", "10-15 min"], ["C", "30-50 min"], ["D", "2-3 hours"]], "a": ["C"], "m": false, "e": "C. 30-50 minutes"}, {"n": 41, "t": 3, "q": "Normal adult heart rate:", "o": [["A", "20-40"], ["B", "40-60"], ["C", "60-100"], ["D", "100-140"]], "a": ["C"], "m": false, "e": "C. 60-100 bpm"}, {"n": 42, "t": 3, "q": "Normal adult respiratory rate:", "o": [["A", "4-8"], ["B", "12-20"], ["C", "20-30"], ["D", "30-40"]], "a": ["B"], "m": false, "e": "B. 12-20/min"}, {"n": 43, "t": 3, "q": "Normal adult SpO2:", "o": [["A", "70-80%"], ["B", "80-90%"], ["C", "90-94%"], ["D", "95-100%"]], "a": ["D"], "m": false, "e": "D. 95-100%"}, {"n": 44, "t": 3, "q": "Normal adult temperature on the study sheet:", "o": [["A", "90-95 F const E=["Hand hygiene before and after patient contact is the single most effective way to stop germs spreading.", "The chain needs a source, a route of spread, and a susceptible host. Break any link and infection stops.", "HAI means an infection picked up while getting healthcare. Community-acquired means picked up outside healthcare.", "Older age, chronic illness, and devices like tubes, lines, and catheters raise infection risk.", "Contact precautions are for germs spread by touching the patient or their surroundings, such as MRSA and C. diff.", "Contact precautions call for gloves and a gown.", "TB, measles, and chickenpox spread through tiny airborne particles. Flu is droplet; C. diff and MRSA are contact.", "The gown goes on first: Gown, Mask, Goggles, Gloves.", "Put-on order is Gown, Mask, Goggles, Gloves (Get My Gear Going). Gloves go over the gown cuffs.", "Take-off order is Gloves, Goggles, Gown, Mask, then wash hands. The mask is last.", "Wash your hands right after everything is off, since you may have touched contaminated items.", "The outside of PPE is dirty. Touch only the inside, straps, or back when removing it.", "Never recap needles. Sharps go straight into the sharps container to prevent needle sticks.", "Visibly dirty hands need soap and water. Sanitizer only works on hands that look clean.", "If hands look clean, alcohol-based sanitizer is appropriate.", "Jewelry and watch come off first so germs are not trapped under them and they can't block scrubbing.", "The five parts are Sender, Receiver, Message, Channel, and Feedback.", "The sender starts the message and encodes it. The receiver decodes it.", "The message is the information being shared.", "The channel is how the message travels: hearing, seeing, touch, verbal, nonverbal, or written.", "Linguistic communication is spoken words or written symbols.", "Paralinguistic communication is nonverbal: gestures, eye contact, and facial expressions.", "Metacommunication is the context around the message: setting, mood, culture, and relationships.", "SBAR is Situation, Background, Assessment, Recommendation, the standard way to report on a patient.", "Situation states what is happening right now.", "Background gives relevant history, such as diagnoses and why the patient was admitted.", "Assessment is your clinical findings and what you think the problem is.", "Recommendation says what you think should happen next.", "CUS words are Concerned, Uncomfortable, Safety issue. They signal you need to be heard.", "Assertive statements are clear, direct, and respectful, like stating a safety concern. Blaming or avoiding are not assertive.", "Open-ended statements invite the patient to share more. Yes/no questions are closed.", "Giving advice (along with false reassurance and asking \"why\") blocks therapeutic communication.", "If a patient says no or hesitates, stop and report. Consent must be freely given.", "Informed consent covers what, why, risks and benefits, alternatives (including nothing), and the right to refuse or stop.", "Metacognition is thinking about your own thinking, such as asking whether you really understand.", "Learn mode means studying as if you have to teach it, which builds real understanding.", "Bloom's levels go Remembering, Understanding, Applying, Analyzing, Evaluating, Creating. Applying follows Understanding.", "Creating is the highest Bloom's level listed.", "The Short Study Cycle starts with setting a goal (1-2 minutes).", "Focused study in the cycle is 30-50 minutes.", "Normal adult heart rate is 60-100 beats per minute.", "Normal adult respiratory rate is 12-20 breaths per minute.", "Normal SpO2 is 95-100%.", "The sheet lists normal temperature as 97-99 F (36.1-37.2 C).", "Use the first 2-3 fingers. The thumb has its own pulse and can confuse the count.", "The radial pulse is at the wrist. The carotid is at the neck and the brachial is at the arm.", "Thready means weak AND irregular. Bounding means very strong, then gone quickly.", "P stands for Provocation/Palliation: what makes the pain worse or better.", "Sharp or burning describes what the pain feels like, which is Quality (Q).", "T stands for Timing: when it started and whether it is constant or comes and goes.", "Hand hygiene, PPE, safe sharps handling, and route-based precautions break the chain. Ignoring high-touch surfaces keeps it going.", "C. diff is a contact precaution, so gloves and a gown are used.", "TB is airborne: N95 respirator plus gown and gloves, in a special room.", "Removal order is Gloves, Goggles, Gown, Mask, then hands.", "Start with jewelry off, then wet hands, soap and scrub, rinse, and dry and turn off the water with the towel.", "Hand hygiene is needed after removing gloves and before touching anything else.", "Gloves come off first, the outside is dirty, touch only the inside, straps, or back, and wash hands at the end. Never touch the front of the mask.", "A respirator is removed after leaving the room and closing the door. Other PPE comes off before leaving.", "Touch only the inside of the gown and roll it inside-out so the dirty outside stays contained.", "Droplets from coughs and sneezes travel a short distance, which calls for droplet precautions.", "This states what is happening right now, which is Situation.", "History and reason for admission are Background.", "Findings about the patient's current condition are Assessment.", "\"I recommend...\" states what you want done, which is Recommendation.", "Silence, being present, restating, exploring, and clarifying are therapeutic. Giving advice blocks communication.", "An open statement invites the patient to share. \"Why\" questions and false reassurance shut communication down.", "Closed (yes/no) questions fit safety concerns or confused patients.", "For an oriented patient who can share, an open statement draws out their feelings.", "Tell the patient what you will do, why, risks and benefits, alternatives (including doing nothing), and that they can refuse or stop.", "A confused or hesitant patient has not given informed consent, so stop and report.", "CUS is Concerned, Uncomfortable, Safety issue. The statement names all three.", "Assertive communication means clearly stating the safety concern. Silence or blame does not protect the patient.", "Advocacy means speaking up for the patient so their needs are met, clearly and confidently.", "The EHR must be accurate and timely. It is a legal document and proof of what you did.", "Environment, mood, education, noise, culture, and power or hierarchy all shape how a message is received.", "Studying as if you must teach it puts you in learn mode, which shows whether you truly understand.", "Knowing a definition is Remembering. Using it in a patient scenario is Applying, the next level to practice.", "Applying a concept to a scenario is a higher level than reciting or matching definitions.", "Setting a goal, focusing 30-50 minutes, rewarding yourself, then reviewing is the Short Study Cycle.", "The cycle order is goal, focused study, reward, review.", "Athletes can have a resting heart rate of 40-60, so 48 is not always abnormal.", "Bradypnea means too slow. 8 breaths per minute is below the normal 12-20.", "Tachypnea means a rapid respiratory rate.", "Orthopnea is hard to breathe unless upright. Dyspnea is hard or labored breathing in general.", "Apnea means no breathing.", "Fast rate, accessory muscle use, color change, and low SpO2 signal distress. Normal effort does not.", "Patients may change their breathing if they know you are counting, so count discreetly after the pulse.", "Assess respirations for rate, rhythm, and effort (depth and accessory muscle use).", "On the pain scale 7-10 is severe, so 8 is severe.", "When it started and whether it comes and goes is Timing.", "Where the pain is and where it spreads is Region/Radiation.", "What makes pain worse or better is Provocation/Palliation.", "135/84: systolic 130-139 and diastolic 80-89 is Stage 1 hypertension.", "150/95: systolic 140 or higher and diastolic 90 or higher is Stage 2 hypertension.", "Systolic is the pressure when the heart squeezes (first sound heard).", "Diastolic is the pressure when the heart relaxes (last sound heard).", "Place the cuff, put the stethoscope over the brachial artery, inflate, release slowly, then record top/bottom.", "Stress, pain, exercise, eating, obesity, and heredity raise BP. Blood loss lowers it.", "A pulse is checked for rate, rhythm, and volume (strength).", "Keep the finger still so the pulse oximeter can read oxygen saturation accurately."];
const TOP=["Infection control","Communication","Study skills","Vital signs"],COL=["#2563eb","#2563eb","#2563eb","#2563eb"];

 <button class="go" onclick="start('rand')">Mixed practice<small>20 random questions from every topic</small></button>

function start(m){
 L=m==="miss"?Q.filter(x=>S.r[x.n]===0):m==="all"||m==="rand"?Q:Q.filter(x=>x.t===m);

}
function check(){
 if(!sel.size)return;done=true;
 const ok=sel.size===q.a.length&&q.a.every(x=>sel.has(x));
 S.r[q.n]=ok?1:0;if(ok)score++;save();nav(-1);draw();
}
function next(){i++;i<L.length?show():end()}
function end(){
 nav(-1);const p=Math.round(score/L.length*100);
 A.innerHTML=`<p class="q">Round complete</p><div class="big">${score}/${L.length}</div><p>${p}% correct. ${p>=80?"Great work!":"Review your missed questions to lock them in."}</p>
 <button class="go" onclick="start('miss')" ${miss()?"":"disabled"}>Review missed (${miss()})</button><button class="go b" onclick="home()">Back to home</button>`;
}
home();
</script></body></html>
